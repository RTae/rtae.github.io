baseurl = "https://www.rtae.tech/"
title = "Natthanan Bhukan"
theme = "hugo-theme-console"
languageCode = "en-us"
enableRobotsTXT = true
# Derives Lastmod from git commit dates instead of front-matter `date`, so the
# sitemap reflects real edits. Needs full history: the deploy workflow already
# checks out with fetch-depth: 0.
enableGitInfo = true

# [services.googleAnalytics]
#   ID = "G-XXXXXXXXXX"   # uncomment and fill in to enable the theme's GA tag

[params]
  author = "Natthanan Bhukan"
  jobTitle = "Machine Learning Engineer"
  description = "Natthanan Bhukan — machine learning engineer working on LLM serving, inference optimisation, and MLOps infrastructure."
  # sameAs feeds the Person JSON-LD on the home page; add/remove profiles freely.
  sameAs = [
    "https://github.com/RTae",
    "https://medium.com/@RTae",
  ]
  # Cutting off the page title to two chars for mobile (console-demo -> co)
  titleCutting = true

  # Page-load animation intentionally disabled. Leave this unset.
  # (The theme's animate.css v4 uses animate__-prefixed classes, so the old
  # "animated zoomIn fast" value never matched anything and was a no-op.)
  # animateStyle = "animated zoomIn fast"
  
  [[params.navlinks]]
  name = "about/"
  url = "about/"

  [[params.navlinks]]
  name = "articles/"
  url = "articles/"

  [[params.navlinks]]
  name = "events/"
  url = "events/"

  [[params.navlinks]]
  name = "projects/"
  url = "projects/"